name: Update Pre-Media Leads & QSA (CVM IPE + CRA/CRI + ITR + BrasilAPI)

on:
  schedule:
    - cron: '15 11,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-live-data
  cancel-in-progress: false

jobs:
  sync-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect CVM IPE, CRA/CRI & ITR pre-media signals and enrich QSA
        run: python3 update_lead_radar.py

      - name: Commit updated live-leads.json if changed
        run: |
          if ! git diff --quiet live-leads.json || [ -n "$(git ls-files --others --exclude-standard live-leads.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live-leads.json
            git commit -m "chore(leads): auto-sync live-leads.json (CVM IPE + CRA/CRI + ITR + QSA)"
            git pull --rebase -X theirs origin main
            git push
            curl -sS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          else
            echo "No pre-media lead or QSA changes detected."
          fi
