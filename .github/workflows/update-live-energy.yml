name: Update Live Energy Telemetry (ONS + CCEE)

on:
  schedule:
    - cron: '30 15,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-live-data
  cancel-in-progress: false

jobs:
  sync-energy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and consolidate ONS AWS OpenData & CCEE telemetry
        run: python3 update_live_energy.py

      - name: Commit updated live-energy.json if changed
        run: |
          if ! git diff --quiet live-energy.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live-energy.json
            git commit -m "chore(energy): auto-sync live-energy.json"
            git pull --rebase -X theirs origin main
            git push
            curl -sS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          else
            echo "No energy telemetry changes detected."
          fi
